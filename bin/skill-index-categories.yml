# skill-index-categories.yml
# -----------------------------------------------------------------------------
# Maps each `skills/dw-*` skill to a section of `dw-skill-index-crim/SKILL.md`.
# Read by `bin/regen-skill-index.py` to regenerate the routing tables.
#
# Format (a tiny subset of YAML — hand-parsed by regen-skill-index.py):
#
#   <section-id>:
#     - skill: dw-<name>
#       label: "Human-readable role / what-it-handles"   # column 1 of the table
#       trigger: "exact trigger phrase to suggest"        # column 3 of the table
#       # Optional. If omitted, the script extracts the first ALWAYS-invoke
#       # phrase from the skill's frontmatter description.
#
# When you add a new skill, add a row in the right section.
# When a skill's frontmatter description changes, the trigger-phrase column
# auto-refreshes (unless `trigger:` is set explicitly here, in which case the
# config wins).
#
# Section IDs map to markdown headings in dw-skill-index-crim/SKILL.md — see the
# SECTIONS table at the top of regen-skill-index.py.
# -----------------------------------------------------------------------------

